<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Zumito — Elige tus categorías</title>
<style>/* Zumito — design tokens shared by every screen */

:root,
[data-theme="light"] {
  --color-bg: #FFFBF5;
  --color-surface: #FFFFFF;
  --color-surface-soft: #FFF4E0;
  --color-text: #2B1D0E;
  --color-text-soft: #8A7355;
  --color-border: rgba(43, 29, 14, 0.09);
  --shadow-color: rgba(255, 138, 31, 0.22);
  --overlay: rgba(43, 29, 14, 0.42);
}

[data-theme="dark"] {
  --color-bg: #1A1208;
  --color-surface: #2A1E12;
  --color-surface-soft: #241A0F;
  --color-text: #FFF4E0;
  --color-text-soft: #C7AD87;
  --color-border: rgba(255, 244, 224, 0.10);
  --shadow-color: rgba(0, 0, 0, 0.40);
  --overlay: rgba(0, 0, 0, 0.55);
}

:root {
  /* citrus palette — same in both themes */
  --color-orange: #FF8A1F;
  --color-lime: #8BC34A;
  --color-strawberry: #FF5C7A;
  --color-blueberry: #5B5BD6;
  --color-lemon: #FFD23F;

  --gradient-citrus: linear-gradient(135deg, #FF8A1F 0%, #FFD23F 100%);

  --font-display: 'Poppins', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, sans-serif;
  --font-numeric: 'Inter', system-ui, sans-serif;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;

  --shadow-soft: 0 10px 28px -8px var(--shadow-color);
  --shadow-card: 0 4px 16px -6px var(--shadow-color);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
.zu-tap { min-height: 44px; min-width: 44px; }
</style>
</head>
<body>
<x-dc>
<helmet>
<style>
  .zu-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--color-border); }
  .zu-dot-active { width: 22px; background: var(--color-orange); }
  .zu-btn-primary { border: none; background: var(--gradient-citrus); color: #2B1D0E; font-family: var(--font-display); font-weight: 800; font-size: 16px; border-radius: var(--radius-pill); padding: 16px; text-align: center; text-decoration: none; display: block; box-shadow: var(--shadow-soft); width: 100%; }
  .zu-chip { border-radius: var(--radius-md); border: 2px solid var(--color-border); background: var(--color-surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px 4px; }
  .zu-chip-on { border-color: var(--color-orange); background: var(--color-surface-soft); }
  .zu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--color-bg); display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 4px 20px; display: flex; align-items: center; justify-content: space-between;">
    <a href="Onboarding-1-Bienvenida.dc.html" aria-label="Atrás" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--color-text);">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <a href="Main.dc.html" style="font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--color-text-soft); text-decoration: none;">Saltar</a>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 8px 24px 16px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <div style="font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--color-text);">¿En qué sueles gastar?</div>
      <div style="font-size: 14px; color: var(--color-text-soft); margin-top: 6px;">Elige tus categorías favoritas — luego puedes cambiarlas cuando quieras.</div>
    </div>

    <div class="zu-grid">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="13">
        <button class="zu-chip zu-tap {{c.cls}}" sc-camel-on-click="{{c.toggle}}">
          <span style="font-size: 26px;">{{c.emoji}}</span>
          <span style="font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--color-text);">{{c.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 24px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="display: flex; gap: 6px;">
      <div class="zu-dot"></div>
      <div class="zu-dot zu-dot-active"></div>
      <div class="zu-dot"></div>
    </div>
    <a href="Onboarding-3-Instalar.dc.html" class="zu-btn-primary zu-tap">Continuar · {{count}} elegidas</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      selected: { Comida: true, Super: true, Ocio: true, Transporte: true },
    };
  }
  toggle(key) {
    const s = { ...this.state.selected };
    s[key] = !s[key];
    this.setState({ selected: s });
  }
  renderVals() {
    const list = [
      ['Comida', '🍽️', 'Comida'], ['Super', '🛒', 'Súper'], ['Cafes', '☕', 'Cafés'],
      ['Ocio', '🍻', 'Ocio'], ['Transporte', '🚌', 'Transporte'], ['Gasolina', '⛽', 'Gasolina'],
      ['Hogar', '🏠', 'Hogar'], ['Salud', '💊', 'Salud'], ['Ropa', '👕', 'Ropa'],
      ['Regalos', '🎁', 'Regalos'], ['Viajes', '✈️', 'Viajes'], ['Suscripciones', '📱', 'Suscripciones'],
      ['Mascotas', '🐶', 'Mascotas'],
    ];
    const cats = list.map(([key, emoji, name]) => ({
      key, emoji, name,
      cls: this.state.selected[key] ? 'zu-chip-on' : '',
      toggle: () => this.toggle(key),
    }));
    const count = Object.values(this.state.selected).filter(Boolean).length;
    return { theme: this.props.theme ?? 'light', cats, count };
  }
}
</script>


</body></html>
