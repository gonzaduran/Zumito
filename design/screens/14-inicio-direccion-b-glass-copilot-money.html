<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Zumito — Inicio (Dirección B · Glass)</title>
<style>/* Zumito v2 — neutral, premium fintech direction. Replaces the citrus palette. */

:root,
[data-theme="light"] {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --surface-soft: #F2F2F5;
  --surface-raised: #FFFFFF;
  --text: #14151A;
  --text-soft: #6B7280;
  --text-faint: #A0A3AD;
  --border: #E7E7EC;
  --border-strong: #D6D7DE;
  --shadow-card: 0 1px 2px rgba(20,21,26,0.04), 0 10px 28px -14px rgba(20,21,26,0.14);
  --overlay: rgba(20, 21, 26, 0.45);
  --glass: rgba(255, 255, 255, 0.72);
}

[data-theme="dark"] {
  --bg: #0B0B0E;
  --surface: #17181D;
  --surface-soft: #1F2026;
  --surface-raised: #1C1D23;
  --text: #F5F5F7;
  --text-soft: #9AA0AE;
  --text-faint: #6B6F7B;
  --border: #2A2B33;
  --border-strong: #383A44;
  --shadow-card: 0 1px 2px rgba(0,0,0,0.30), 0 14px 32px -16px rgba(0,0,0,0.55);
  --overlay: rgba(0, 0, 0, 0.55);
  --glass: rgba(23, 24, 29, 0.72);
}

:root {
  --accent: #5457E5;
  --accent-strong: #4245C7;
  --accent-ink: #FFFFFF;
  --accent-wash: rgba(84, 87, 229, 0.10);

  --cat-teal: #2F9C95;
  --cat-amber: #B9852A;
  --cat-rose: #C15B75;
  --cat-sage: #6B8F71;
  --cat-plum: #8B5FBF;
  --cat-terracotta: #C1704F;
  --cat-slate: #5B6B8C;

  --positive: #3A8C64;
  --danger: #C7434B;

  --font-sans: 'Manrope', system-ui, sans-serif;
  --font-numeric: 'Inter', system-ui, sans-serif;

  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  --radius-sm: 14px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-pill: 999px;
}

[data-theme="dark"] {
  --accent: #7274FF;
  --accent-strong: #9294FF;
  --accent-wash: rgba(114, 116, 255, 0.14);
  --cat-teal: #4FBDB5;
  --cat-amber: #D9A24B;
  --cat-rose: #E0839B;
  --cat-sage: #8FB495;
  --cat-plum: #A883D9;
  --cat-terracotta: #E0916D;
  --cat-slate: #8393B3;
  --positive: #5FBF8F;
  --danger: #FF6B72;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
.zu-tap { min-height: 44px; min-width: 44px; }
.zu-num { font-family: var(--font-numeric); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<x-dc>
<helmet>
<style>
  .zu-seg-btn { border: none; background: none; font-family: var(--font-sans); font-weight: 700; font-size: 12px; padding: 7px 0; border-radius: var(--radius-pill); flex: 1; }
  .zu-catcard { flex-shrink: 0; width: 92px; background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .zu-exprow { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 12px; display: flex; align-items: center; gap: 12px; }
  .zu-navpill { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 64px; border-radius: var(--radius-pill); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 16px 32px -12px rgba(20,21,26,0.22); display: flex; align-items: center; padding: 0 8px; border: 1px solid var(--border); }
  .zu-navbtn { flex: 1; border: none; background: none; display: flex; align-items: center; justify-content: center; height: 100%; }
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="flex: 1; overflow-y: auto; padding: 22px 20px 110px 20px; display: flex; flex-direction: column; gap: 22px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-size: 13px; color: var(--text-soft); font-weight: 600;">Hola, Gonzalo</div>
        <div style="font-family: var(--font-sans); font-weight: 800; font-size: 20px; color: var(--text); margin-top: 2px;">Tu resumen</div>
      </div>
      <button aria-label="Ajustes" class="zu-tap" style="width: 40px; height: 40px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-card); border: none; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg>
      </button>
    </div>

    <div style="background: linear-gradient(155deg, var(--accent) 0%, var(--accent-strong) 100%); border-radius: var(--radius-lg); padding: 20px; position: relative; overflow: hidden; box-shadow: var(--shadow-card);">
      <div style="display: flex; background: rgba(255,255,255,0.16); border-radius: var(--radius-pill); padding: 4px; margin-bottom: 16px;">
        <sc-for list="{{periods}}" as="p" hint-placeholder-count="4">
          <button class="zu-seg-btn zu-tap" sc-camel-on-click="{{p.select}}" style="color: {{p.textColor}}; background: {{p.bg}};">{{p.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between;">
        <div>
          <div style="font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.75);">Gasto {{periodLabel}}</div>
          <div class="zu-num" style="font-size: 38px; font-weight: 800; color: #FFFFFF; margin-top: 2px;">{{amount}}</div>
          <div style="font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.85); margin-top: 4px;">{{deltaArrow}} {{deltaPct}} {{deltaLabel}}</div>
        </div>
        <svg width="68" height="68" sc-camel-view-box="0 0 68 68">
          <circle cx="34" cy="34" r="28" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="7"></circle>
          <circle cx="34" cy="34" r="28" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="{{ringOffset}}" transform="rotate(-90 34 34)"></circle>
          <text x="34" y="39" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">{{ringLabel}}</text>
        </svg>
      </div>
    </div>

    <div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;">
        <div style="font-family: var(--font-sans); font-weight: 800; font-size: 15px;">Categorías</div>
        <span style="font-size: 12px; font-weight: 700; color: var(--accent);">Ver todo</span>
      </div>
      <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px;">
        <sc-for list="{{categories}}" as="c" hint-placeholder-count="5">
          <div class="zu-catcard">
            <span style="width: 38px; height: 38px; border-radius: 999px; background: {{c.wash}}; display: flex; align-items: center; justify-content: center; font-size: 18px;">{{c.emoji}}</span>
            <span style="font-size: 11px; font-weight: 700;">{{c.name}}</span>
            <span class="zu-num" style="font-size: 12px; font-weight: 800; color: {{c.color}};">{{c.amount}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;">
        <div style="font-family: var(--font-sans); font-weight: 800; font-size: 15px;">Movimientos recientes</div>
        <span style="font-size: 12px; font-weight: 700; color: var(--accent);">Historial</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{expenses}}" as="e" hint-placeholder-count="4">
          <div class="zu-exprow">
            <span style="font-size: 17px; width: 36px; height: 36px; border-radius: 999px; background: var(--surface-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{e.emoji}}</span>
            <span style="flex-grow: 1;">
              <span style="display: block; font-weight: 700; font-size: 14px;">{{e.place}}</span>
              <span style="display: block; font-size: 12px; color: var(--text-soft); margin-top: 1px;">{{e.when}}</span>
            </span>
            <span class="zu-num" style="font-weight: 800; font-size: 14px;">{{e.amount}}</span>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div class="zu-navpill">
    <sc-for list="{{navItemsBefore}}" as="n" hint-placeholder-count="2">
      <button class="zu-navbtn zu-tap" sc-camel-on-click="{{n.select}}" style="color: {{n.color}};"><span style="font-size: 19px;">{{n.icon}}</span></button>
    </sc-for>
    <button class="zu-tap" aria-label="Añadir gasto" style="width: 48px; height: 48px; border-radius: 999px; background: linear-gradient(155deg, var(--accent) 0%, var(--accent-strong) 100%); border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px -4px var(--accent-wash); flex-shrink: 0;">
      <span style="color: #FFFFFF; font-size: 22px; font-weight: 700;">＋</span>
    </button>
    <sc-for list="{{navItemsAfter}}" as="n" hint-placeholder-count="2">
      <button class="zu-navbtn zu-tap" sc-camel-on-click="{{n.select}}" style="color: {{n.color}};"><span style="font-size: 19px;">{{n.icon}}</span></button>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: 'Mes', nav: 'home' };
  }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const data = {
      Hoy:    { amount: '18,40 €',  arrow: '↓', pct: '62%', label: 'menos que ayer' },
      Semana: { amount: '96,20 €',  arrow: '↑', pct: '8%',  label: 'más que la semana pasada' },
      Mes:    { amount: '482,30 €', arrow: '↑', pct: '12%', label: 'más que en agosto' },
      Total:  { amount: '3.104,55 €', arrow: '—', pct: '',  label: 'desde que usas Zumito' },
    };
    const cur = data[this.state.period];
    const periods = ['Hoy', 'Semana', 'Mes', 'Total'].map((p) => ({
      label: p, select: () => this.setState({ period: p }),
      bg: p === this.state.period ? 'rgba(255,255,255,0.9)' : 'transparent',
      textColor: p === this.state.period ? 'var(--accent-strong)' : 'rgba(255,255,255,0.85)',
    }));

    const categories = [
      { emoji: '🏠', name: 'Hogar',  amount: '142,90 €', wash: 'color-mix(in srgb, var(--cat-slate) 16%, var(--surface-soft))', color: 'var(--cat-slate)' },
      { emoji: '🍽️', name: 'Comida', amount: '128,40 €', wash: 'color-mix(in srgb, var(--cat-amber) 16%, var(--surface-soft))', color: 'var(--cat-amber)' },
      { emoji: '🛒', name: 'Súper',  amount: '96,10 €',  wash: 'color-mix(in srgb, var(--cat-teal) 16%, var(--surface-soft))', color: 'var(--cat-teal)' },
      { emoji: '🍻', name: 'Ocio',   amount: '88,00 €',  wash: 'color-mix(in srgb, var(--cat-rose) 16%, var(--surface-soft))', color: 'var(--cat-rose)' },
      { emoji: '☕', name: 'Cafés',  amount: '24,60 €',  wash: 'color-mix(in srgb, var(--cat-plum) 16%, var(--surface-soft))', color: 'var(--cat-plum)' },
    ];

    const expenses = [
      { emoji: '🍽️', place: 'Restaurante La Parra', when: 'Hoy · 14:32', amount: '18,40 €' },
      { emoji: '☕', place: 'Café con Marta',        when: 'Hoy · 09:10', amount: '3,20 €' },
      { emoji: '🛒', place: 'Mercadona',              when: 'Ayer · 19:05', amount: '42,75 €' },
      { emoji: '🚌', place: 'Bono bus',               when: 'Ayer · 08:00', amount: '12,00 €' },
    ];

    const navList = [
      ['home', '⌂'], ['historial', '☰'], ['stats', '◔'], ['ajustes', '⚙'],
    ];
    const navItems = navList.map(([key, icon]) => ({
      icon, select: () => this.setState({ nav: key }),
      color: this.state.nav === key ? 'var(--accent)' : 'var(--text-soft)',
    }));

    return {
      theme,
      periods, periodLabel: this.state.period.toLowerCase(), amount: cur.amount, deltaArrow: cur.arrow, deltaPct: cur.pct, deltaLabel: cur.label,
      ringOffset: 176 - 176 * 0.62, ringLabel: '62%',
      categories, expenses,
      navItemsBefore: navItems.slice(0, 2),
      navItemsAfter: navItems.slice(2),
    };
  }
}
</script>


</body></html>
