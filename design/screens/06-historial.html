<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Zumito — Historial</title>
<style>/* Zumito — design tokens shared by every screen */

:root,
[data-theme="light"] {
  --color-bg: #FFFBF5;
  --color-surface: #FFFFFF;
  --color-surface-soft: #FFF4E0;
  --color-text: #2B1D0E;
  --color-text-soft: #8A7355;
  --color-border: rgba(43, 29, 14, 0.09);
  --shadow-color: rgba(255, 138, 31, 0.22);
  --overlay: rgba(43, 29, 14, 0.42);
}

[data-theme="dark"] {
  --color-bg: #1A1208;
  --color-surface: #2A1E12;
  --color-surface-soft: #241A0F;
  --color-text: #FFF4E0;
  --color-text-soft: #C7AD87;
  --color-border: rgba(255, 244, 224, 0.10);
  --shadow-color: rgba(0, 0, 0, 0.40);
  --overlay: rgba(0, 0, 0, 0.55);
}

:root {
  /* citrus palette — same in both themes */
  --color-orange: #FF8A1F;
  --color-lime: #8BC34A;
  --color-strawberry: #FF5C7A;
  --color-blueberry: #5B5BD6;
  --color-lemon: #FFD23F;

  --gradient-citrus: linear-gradient(135deg, #FF8A1F 0%, #FFD23F 100%);

  --font-display: 'Poppins', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, sans-serif;
  --font-numeric: 'Inter', system-ui, sans-serif;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;

  --shadow-soft: 0 10px 28px -8px var(--shadow-color);
  --shadow-card: 0 4px 16px -6px var(--shadow-color);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
.zu-tap { min-height: 44px; min-width: 44px; }
</style>
</head>
<body>
<x-dc>
<helmet>
<style>
  .zu-h1 { font-family: var(--font-display); font-weight: 800; }
  .zu-num { font-family: var(--font-numeric); font-variant-numeric: tabular-nums; }
  .zu-filter { border-radius: var(--radius-pill); border: 2px solid var(--color-border); background: var(--color-surface); padding: 8px 14px; font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--color-text); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .zu-filter-on { border-color: var(--color-orange); background: var(--color-surface-soft); color: var(--color-orange); }
  .zu-search { width: 100%; border: 1px solid var(--color-border); background: var(--color-surface); border-radius: var(--radius-pill); padding: 12px 16px 12px 40px; font-size: 14px; font-family: var(--font-body); }
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--color-bg); display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 12px 20px; display: flex; flex-direction: column; gap: 14px;">
    <div class="zu-h1" style="font-size: 22px;">Historial</div>
    <div style="position: relative;">
      <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--color-text-soft);">🔍</span>
      <input class="zu-search" type="text" placeholder="Buscar por lugar, nota, persona…">
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button class="zu-filter zu-tap {{f.cls}}" sc-camel-on-click="{{f.toggle}}">{{f.icon}} {{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 0 20px 16px 20px; display: flex; flex-direction: column; gap: 20px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
          <span style="font-family: var(--font-body); font-weight: 800; font-size: 13px; color: var(--color-text-soft); text-transform: uppercase; letter-spacing: 0.02em;">{{g.label}}</span>
          <span class="zu-num" style="font-weight: 800; font-size: 13px; color: var(--color-text);">{{g.subtotal}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{g.items}}" as="e" hint-placeholder-count="3">
            <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px; display: flex; align-items: center; gap: 12px;">
              <span style="font-size: 20px; width: 36px; height: 36px; border-radius: 999px; background: var(--color-surface-soft); display: flex; align-items: center; justify-content: center;">{{e.emoji}}</span>
              <span style="flex-grow: 1;">
                <span style="display: block; font-weight: 700; font-size: 14px;">{{e.place}}</span>
                <span style="display: block; font-size: 12px; color: var(--color-text-soft);">{{e.time}} · {{e.person}}</span>
              </span>
              <span class="zu-num" style="font-weight: 800; font-size: 15px;">{{e.amount}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <dc-import name="NavBar" active="historial" theme="{{theme}}" hint-size="390px,88px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: {} };
  }
  toggleFilter(key) {
    const a = { ...this.state.active };
    a[key] = !a[key];
    this.setState({ active: a });
  }
  renderVals() {
    const filterList = [
      ['fecha', '📅', 'Fecha'], ['categoria', '🏷️', 'Categoría'], ['lugar', '📍', 'Lugar'],
      ['persona', '👥', 'Persona'], ['importe', '💶', 'Importe'],
    ];
    const filters = filterList.map(([key, icon, label]) => ({
      key, icon, label,
      cls: this.state.active[key] ? 'zu-filter-on' : '',
      toggle: () => this.toggleFilter(key),
    }));

    const groups = [
      {
        label: 'Hoy · 29 sept.', subtotal: '21,60 €',
        items: [
          { emoji: '🍽️', place: 'Restaurante La Parra', time: '14:32', person: 'Amigos', amount: '18,40 €' },
          { emoji: '☕', place: 'Café con Marta', time: '09:10', person: 'Pareja', amount: '3,20 €' },
        ],
      },
      {
        label: 'Ayer · 28 sept.', subtotal: '54,75 €',
        items: [
          { emoji: '🛒', place: 'Mercadona', time: '19:05', person: 'Solo/a', amount: '42,75 €' },
          { emoji: '🚌', place: 'Bono bus', time: '08:00', person: 'Solo/a', amount: '12,00 €' },
        ],
      },
      {
        label: '27 sept.', subtotal: '89,20 €',
        items: [
          { emoji: '🏠', place: 'Ferretería Sur', time: '18:20', person: 'Pareja', amount: '34,20 €' },
          { emoji: '🍻', place: 'Cervecería Nena', time: '21:50', person: 'Amigos', amount: '32,00 €' },
          { emoji: '⛽', place: 'Repsol A-92', time: '10:00', person: 'Solo/a', amount: '23,00 €' },
        ],
      },
    ];
    return { theme: this.props.theme ?? 'light', filters, groups };
  }
}
</script>


</body></html>
